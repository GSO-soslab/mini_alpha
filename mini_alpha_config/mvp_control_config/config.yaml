control_modes:
  idle: false

  teleop:
    z:        {p: 10.0,    i: 1.0 ,  d: 5.0, v: 0.0,  pid_max: 10, pid_min: -10}
    u:        {p: 15.0,    i: 1.0 ,  d: 5.0, v: 0.0,  pid_max: 50, pid_min: -10}
    pitch:    {p: 5.0,   i: 0.5,  d: 2.0,  v: 0.0, pid_max: 10, pid_min: -10}
    roll:     {p: 1.0,   i: 0.0,  d: 1.0,  v: 0.0, pid_max: 5, pid_min: -5}
    yaw:      {p: 10.0,    i: 1.0 ,  d: 5.0, v: 0.0,  pid_max: 10, pid_min: -10}


thruster_ids:
  surge_port:
    control_tf: surge_port_thruster_link
    command_topic: control/thruster/surge_port
    force_topic: control/force/surge_port
    limits: [-5.0, 5.0] #[min, max]
    delta_limit: 0.1
    polynomials: [0.0, 5.0277, 0.98, 4.7723]

  surge_starboard:
    control_tf: surge_starboard_thruster_link
    command_topic: control/thruster/surge_starboard
    force_topic: control/force/surge_starboard
    limits: [-5.0, 5.0] #[min, max]
    delta_limit: 0.1
    polynomials: [0.0, 5.0277, 0.98, 4.7723]
    
  heave_port:
    control_tf: heave_port_thruster_link
    command_topic: control/thruster/heave_port
    force_topic: control/force/heave_port
    limits: [-5.0, 5.0] #[min, max]
    delta_limit: 0.1
    polynomials: [0.0, 5.0277, 0.98, 4.7723]

  heave_starboard:
    control_tf: heave_starboard_thruster_link
    command_topic: control/thruster/heave_stbd
    force_topic: control/force/heave_starboard
    limits: [-5.0, 5.0] #[min, max]
    delta_limit: 0.1
    polynomials: [0.0, 5.0277, 0.98, 4.7723]
